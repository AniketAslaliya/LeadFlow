name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: leadflow
          POSTGRES_PASSWORD: leadflow
          POSTGRES_DB: leadflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leadflow -d leadflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://leadflow:leadflow@localhost:5432/leadflow_test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: leadflow
          POSTGRES_PASSWORD: leadflow
          POSTGRES_DB: leadflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leadflow -d leadflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://leadflow:leadflow@localhost:5432/leadflow_test
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Server install + migrate
        working-directory: server
        run: |
          npm ci
          npx prisma migrate deploy
      - name: Client install + build
        working-directory: client
        run: |
          npm ci
          npm run build
      - name: Playwright browsers
        working-directory: client
        run: npx playwright install chromium --with-deps
      - name: Start API (background)
        working-directory: server
        run: node src/index.js &
      - name: Start Vite preview (background)
        working-directory: client
        env:
          VITE_API_PROXY: http://127.0.0.1:3001
        run: npx vite preview --host 127.0.0.1 --port 5173 --strictPort &
      - name: Wait for servers
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3001/api/leads >/dev/null && curl -sf http://127.0.0.1:5173 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: E2E
        working-directory: client
        run: npx playwright test
